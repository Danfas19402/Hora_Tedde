<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f6b3a">

  <title>HORA TEDDE — Controle de Ponto</title>

  <link rel="icon" type="image/png" href="HORA_TEDDE/img/images.png">
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js" defer></script>
</head>

<body>

  <header class="topo">
    <div class="limite topo-conteudo">

      <div class="marca">
       <img src="HORA_TEDDE/img/images.png"/>


        <div>
          <h1>HORA TEDDE</h1>
          <p>Controle de Ponto</p>
        </div>
      </div>

      <button id="btnTema" class="btn btn-neutro" type="button">🌙 Escuro</button>
    </div>
  </header>

  <main class="limite">

    <div class="acoes no-print">
      <button id="btnAdd" class="btn btn-primario" type="button">+ Adicionar dia</button>
      <button id="btnFolga" class="btn btn-destaque" type="button">Folga</button>
      <button id="btnExcel" class="btn btn-neutro" type="button">Exportar Excel</button>
      <button id="btnPdf" class="btn btn-neutro" type="button">Exportar PDF</button>
      <button id="btnPrint" class="btn btn-neutro" type="button">Imprimir</button>
      <button id="btnLimpar" class="btn btn-perigo" type="button">Limpar tudo</button>
    </div>

    <section class="resumo">
      <div class="cartao">
        <span class="rotulo">Jornada</span>
        <input id="inpJornada" type="time" value="08:00" class="no-print">
      </div>
      <div class="cartao">
        <span class="rotulo">Trabalhadas</span>
        <strong id="totTrab">00:00</strong>
      </div>
      <div class="cartao">
        <span class="rotulo">Extras</span>
        <strong id="totExtra" class="verde">00:00</strong>
      </div>
    </section>

    <p id="vazio" class="vazio">Nenhum dia ainda. Toque em “Adicionar dia”.</p>

    <section id="lista"></section>

  </main>

  <footer class="rodape">
    <div class="limite rodape-conteudo">
      <img src="HORA_TEDDE/img/images.png" alt="Símbolo do HORA TEDDE" class="rodape-logo">
      <div>
        <strong>HORA TEDDE</strong>
        <p>© 2026 HORA TEDDE — Desenvolvido por Daniel Fealsi</p>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
