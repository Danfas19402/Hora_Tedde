<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f6b3a">
  <title>HORA TEDDE — Controle de Ponto</title>
  <link rel="icon" type="image/png" href="HORA_TEDDE/img/hora-tedde-icone-fundo-transparente.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js" defer></script>
</head>
<body>
  <header class="topo">
    <div class="limite topo-conteudo">
      <div class="marca">
       <img/src="icons/hora-tedde-icone-fundo-transparente.png">
        <div>
          <h1>HORA TEDDE</h1>
          <p>Controle de Ponto</p>
        </div>
      </div>
      <button id="tema" class="botao botao-tema" type="button">🌙 Escuro</button>
    </div>
  </header>

  <main class="limite principal">
    <div class="acoes">
      <button id="adicionar" class="botao primario" type="button">+ Adicionar dia</button>
      <button id="folga" class="botao destaque" type="button">Folga</button>
      <button id="excel" class="botao secundario" type="button">Exportar Excel</button>
      <button id="pdf" class="botao secundario" type="button">Exportar PDF</button>
      <button id="imprimir" class="botao secundario" type="button">Imprimir</button>
      <button id="limpar" class="botao perigo" type="button">Limpar tudo</button>
    </div>

    <section class="resumos">
      <div class="resumo">
        <label for="jornada">Jornada</label>
        <input id="jornada" type="time" value="08:00">
      </div>
      <div class="resumo">
        <span>Trabalhadas</span>
        <strong id="total-trabalhadas">00:00</strong>
      </div>
      <div class="resumo">
        <span>Extras</span>
        <strong id="total-extras" class="verde">00:00</strong>
      </div>
    </section>

    <!-- CAIXA DE ANOTAÇÕES COMPARTILHADA -->
<div class="anotacoes-container">
  <h3>📝 Anotações e Relatos</h3>
  
  <!-- Área de exibição das mensagens -->
  <div id="lista-anotacoes" class="lista-anotacoes">
    <p class="sem-anotacao">Ainda não há anotações. Seja o primeiro a registrar!</p>
  </div>

  <!-- Formulário para enviar -->
  <div class="form-anotacao">
    <textarea 
      id="campo-anotacao" 
      placeholder="Descreva problemas, observações ou recados para a equipe..."
      rows="3"
    ></textarea>
    <button id="btn-enviar-anotacao" class="btn-enviar">Enviar Anotação</button>
  </div>
</div>

    <p id="vazio" class="vazio">Nenhum dia ainda. Toque em “Adicionar dia”.</p>
    <section id="dias" class="lista"></section>
  </main>

  <dialog id="foto-grande">
    <button id="fechar-foto" class="botao perigo" type="button">Fechar</button>
    <img id="foto-ampliada" alt="Foto do relógio de ponto">
  </dialog>

  <footer class="rodape">
    <div class="limite rodape-conteudo">
     
<img
  src="icons/hora-tedde-icone-fundo-transparente.png"
  alt="Símbolo do HORA TEDDE"
  class="logo-rodape"
>

      <div>
        <strong>HORA TEDDE</strong>
        <p>© 2026 HORA TEDDE</p>
        <p>© Desenvolvido por: Daniel Fealsi</p>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
